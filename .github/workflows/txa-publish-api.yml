# TXA Publish API - rebuilds the static REST API (namespace txa.v1) on GitHub Pages.
#
#   https://<owner>.github.io/txa-repo/api/txa/v1/index.json
#   https://<owner>.github.io/txa-repo/api/txa/v1/packages/<Id>.json
#
# The schedule is a safety net: merges performed with the plain workflow token do not
# emit push events, so the index is refreshed periodically as well.
name: TXA Publish API

on:
  push:
    branches: [main]
    paths: ["manifests/**", "policy.txa.yaml", "tools/src/txa/ci/api.py", "tools/src/txa/core/i18n.py", "web/**", "docs/**"]
  # the "waiting for review" list follows the pull requests: refresh it when the bot finishes or a PR is closed.
  # (workflow_run, not pull_request_target: a PR event would stick a "deployed to github-pages" box on the PR page)
  workflow_run:
    workflows: ["TXA Agreement", "TXA Gate", "TXA Lifecycle"]
    types: [completed]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: txa-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build txa.v1 index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install TXA toolchain
        run: python -m pip install --disable-pip-version-check ./tools

      - name: Generate static API
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: txaci build-api --root . --out site --pending

      # The index page is an Astro site (web/). It reads site/api/txa/v1/*.json written above and
      # replaces the plain index.html that build-api leaves as a fallback.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the index page (Astro)
        working-directory: web
        run: |
          npm ci
          npm run icons   # fetches an icon for any package that has none yet; failures keep the monogram
          npm run build
          cp -r dist/. ../site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

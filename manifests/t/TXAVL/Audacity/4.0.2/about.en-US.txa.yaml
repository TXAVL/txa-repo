summary: Easy-to-use, multi-track audio editor and recorder.
description: |-
  Audacity is the world’s most popular free software for recording and editing audio. So if you're producing music, a
  podcast, or just playing around with audio, Audacity is for you. Audacity is for anyone who wants to get creative with
  sound. It’s also the perfect tool for anyone who needs to quickly edit or export audio, for any reason. Cross-
  platform:Runs on all major operating systems – Windows, MacOS and Linux. Import, export, convert:Audacity supports all
  major audio formats, allowing you to convert WAV to MP3, FLAC, Ogg and much more. Plugin support:Elevate your
  productions with a vast selection of third-party plugins, including VST3, Nyquist and more. Deep audio
  analysis:Visualize frequencies in Audacity's Spectogram view or use scientific Vamp analyzers to make discoveries.

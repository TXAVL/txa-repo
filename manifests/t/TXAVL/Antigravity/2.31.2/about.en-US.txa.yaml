name: Antigravity 2.0
publisher: Google
author: Google LLC
summary: Antigravity 2.0 - Central command center to launch, monitor, and orchestrate AI agents.
description: |-
  Antigravity 2.0 serves as your AI agents' central command center, providing a unified platform to launch, monitor, and
  orchestrate their activities. Unlike its predecessor, the Agent Manager, Antigravity 2.0 is a standalone application
  that functions independently of an IDE. Within this interface, you can orchestrate agents both synchronously and
  asynchronously to: - Execute system commands - Perform file read/write operations - Conduct web searches - Integrate
  with external tools via skills and MCP servers - Manage subagents - Interact with Chrome - Create artifacts /
  implementation plans Whether you are performing deep research or building new applications, Antigravity offers a
  streamlined interface for all types of knowledge work.

# TXA Auto-Update - periodically checks upstream sources (WinGet, antigravity.google and the GitHub Releases of
# TXAVL's own repositories, e.g. T-Drop) and updates all managed TXAVL packages in manifests/t/TXAVL/ to their newest versions.
#
# Hand-written packages (CanhCutTeamLauncher, TXAWinSetup, Warframe, or any manifest
# containing `auto-update: false` / `hand-written`) and third-party contributor
# namespaces outside TXAVL are untouched.
name: TXA Auto-Update (TXAVL)

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      package:
        description: "Optional single package to check (e.g. Chrome or AntigravityIDE; leave empty for all TXAVL)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: txa-auto-update
  cancel-in-progress: false

jobs:
  sync:
    name: Auto-update TXAVL manifests
    runs-on: windows-latest
    env:
      APP_ID: ${{ secrets.TXA_APP_ID }}
    steps:
      - name: Bot identity (GitHub App - must be allowed to bypass the main branch rule)
        id: app
        if: env.APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.TXA_APP_ID }}
          private-key: ${{ secrets.TXA_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || github.token }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install TXA toolchain
        run: python -m pip install --disable-pip-version-check ./tools

      - name: Refresh WinGet source
        shell: pwsh
        run: winget source update --disable-interactivity | Out-Null

      - name: Update each package and commit it straight to main
        shell: pwsh
        env:
          PKG_FILTER: ${{ inputs.package }}
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          # No pull request and no human review: each package with a newer version is synced, checked with the
          # full online validator (STEP 01-14: size, SHA-256, signature, ...) and pushed straight to main.
          # The bot (GitHub App) must be allowed to bypass the main branch rule. A release that fails the
          # validator is dropped (nothing is pushed) and the job ends red so you get the mail.
          git config user.name "txa-repo-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $names = if ($env:PKG_FILTER) { @($env:PKG_FILTER) } else { Get-ChildItem manifests/t/TXAVL -Directory | ForEach-Object Name }
          $pushed = 0
          $failures = @()
          foreach ($name in $names) {
            $dir = "manifests/t/TXAVL/$name"
            txacli sync $name --namespace TXAVL
            if ($LASTEXITCODE -ne 0) { $failures += $name; git checkout -q -- $dir; git clean -fdq -- $dir; continue }
            if (-not (git status --porcelain $dir)) { continue }
            $releases = @(git ls-files --others --exclude-standard $dir | ForEach-Object { Split-Path $_ -Parent } | Sort-Object -Unique)
            $valid = $true
            foreach ($release in $releases) {
              txaci validate $release
              if ($LASTEXITCODE -ne 0) { $valid = $false }
            }
            if (-not $valid) {
              Write-Host "::error::TXAVL.${name}: the new release failed validation - not published"
              $failures += $name
              git checkout -q -- $dir; git clean -fdq -- $dir
              continue
            }
            git add $dir
            git commit -q -m "chore(manifests): auto-update TXAVL.$name to the latest upstream version"
            # another commit can land on main while this one is being checked: rebase and retry
            $ok = $false
            foreach ($try in 1..4) {
              git pull -q --rebase origin main
              git push -q origin HEAD:main
              if ($LASTEXITCODE -eq 0) { $ok = $true; break }
              Start-Sleep -Seconds (3 * $try)
            }
            if (-not $ok) { Write-Host "::error::could not push TXAVL.$name to main"; $failures += $name; continue }
            $pushed++
          }
          Write-Host "Published $pushed package update(s) to main."
          if ($failures.Count) { Write-Host "::error::not updated: $($failures -join ', ')"; exit 1 }

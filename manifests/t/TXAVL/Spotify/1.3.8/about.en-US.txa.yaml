description: |-
  With Spotify, it’s easy to find the right music or podcast for every moment – on your phone, your computer, your tablet
  and more. There are millions of tracks and episodes on Spotify. So whether you’re behind the wheel, working out,
  partying or relaxing, the right music or podcast is always at your fingertips. Choose what you want to listen to, or let
  Spotify surprise you. You can also browse through the collections of friends, artists, and celebrities, or create a
  radio station and just sit back.

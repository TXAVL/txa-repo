# TXA Auto-Update - periodically checks upstream sources (WinGet & antigravity.google)
# and updates all managed TXAVL packages in manifests/t/TXAVL/ to their newest versions.
#
# Hand-written packages (CanhCutTeamLauncher, TXAWinSetup, Warframe, or any manifest
# containing `auto-update: false` / `hand-written`) and third-party contributor
# namespaces outside TXAVL are untouched.
name: TXA Auto-Update (TXAVL)

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      package:
        description: "Optional single package to check (e.g. Chrome or AntigravityIDE; leave empty for all TXAVL)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: txa-auto-update
  cancel-in-progress: false

jobs:
  sync:
    name: Auto-update TXAVL manifests
    runs-on: windows-latest
    env:
      APP_ID: ${{ secrets.TXA_APP_ID }}
    steps:
      - name: Bot identity (GitHub App - must be allowed to bypass the main branch rule)
        id: app
        if: env.APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.TXA_APP_ID }}
          private-key: ${{ secrets.TXA_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || github.token }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install TXA toolchain
        run: python -m pip install --disable-pip-version-check ./tools

      - name: Refresh WinGet source
        shell: pwsh
        run: winget source update --disable-interactivity | Out-Null

      - name: Update each package in its own pull request
        shell: pwsh
        env:
          PKG_FILTER: ${{ inputs.package }}
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          # main is protected (pull request + txa/verified) and the bot allows one release per PR:
          # every package that has a newer version gets its own branch and pull request.
          git config user.name "txa-repo-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $names = if ($env:PKG_FILTER) { @($env:PKG_FILTER) } else { Get-ChildItem manifests/t/TXAVL -Directory | ForEach-Object Name }
          $opened = 0
          foreach ($name in $names) {
            txacli sync $name --namespace TXAVL
            $changed = git status --porcelain "manifests/t/TXAVL/$name"
            if (-not $changed) { continue }
            $branch = "txa-auto-update/$name"
            git checkout -q -B $branch
            git add "manifests/t/TXAVL/$name"
            git commit -q -m "chore(manifests): auto-update TXAVL.$name to the latest upstream version"
            git push -q --force origin "HEAD:refs/heads/$branch"
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::could not push $branch"; exit 1 }
            $open = gh pr list --head $branch --state open --json number --jq '.[0].number'
            if ($open) {
              Write-Host "TXAVL.$name: pull request #$open already open - its branch was refreshed."
            } else {
              gh pr create --base main --head $branch --title "Auto-update: TXAVL.$name" --body "Created by the scheduled TXA Auto-Update. The 16 bot checks run on this release; a code owner approves, then it merges. The repository keeps the newest 10 versions of each package; the oldest is removed when one is added."
              if ($LASTEXITCODE -ne 0) { Write-Host "::error::could not open the pull request for $name"; exit 1 }
              $opened++
            }
            git checkout -q main
          }
          Write-Host "Opened $opened new pull request(s)."

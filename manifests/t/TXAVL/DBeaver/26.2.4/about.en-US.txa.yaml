txa: 1
kind: about
ref: TXAVL.DBeaver@26.2.4
lang: en-US
name: DBeaver
publisher: DBeaver Corp
author: DBeaver Corp
summary: Free universal database tool for developers and database administrators.
description: |-
  DBeaver is free and open source universal database tool for developers and database administrators. - Usability is the
  main goal of this project, program UI is carefully designed and implemented. - It is free and open-source (ASL). - It is
  multiplatform. - It is based on opensource framework and allows writing of various extensions (plugins). - It supports
  any database having a JDBC driver. - It may handle any external datasource which may or may not have a JDBC driver. -
  There is a set of plugins for different databases and different database management utilities (e.g. ERD, data transfer,
  compare, data export/import, mock data generation, etc). - It has a great number of features.
homepage: https://dbeaver.io/download/
